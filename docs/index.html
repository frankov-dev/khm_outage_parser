<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khmelnytskyi Outage JSON Feed</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    ul { padding-left: 1.25rem; margin: 0.5rem 0 0; }
    li { margin-bottom: 0.4rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    pre {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      max-height: 460px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Khmelnytskyi Outage JSON Feed</h1>
    <p class="muted">
      Автоматично оновлювані JSON-дані графіків погодинних відключень (ГПВ) з сайту
      <a href="https://hoe.com.ua/page/pogodinni-vidkljuchennja" target="_blank" rel="noopener">hoe.com.ua</a>.
    </p>

    <div class="card">
      <strong>JSON Endpoints:</strong>
      <ul>
        <li><a href="./latest.json"><code>./latest.json</code></a> — останній актуальний графік</li>
        <li><a href="./outages.json"><code>./outages.json</code></a> — усі доступні дати (з історією)</li>
      </ul>
    </div>

    <div class="card">
      <strong>Попередній перегляд <code>latest.json</code></strong>
      <p id="status" class="muted">Завантаження...</p>
      <pre id="preview">{}</pre>
    </div>
  </div>

  <script>
    fetch('./latest.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then((data) => {
        document.getElementById('status').textContent =
          `Дата графіка: ${data.date || '—'} | Оновлено: ${data.last_updated || '—'}`;
        document.getElementById('preview').textContent = JSON.stringify(data, null, 2);
      })
      .catch((err) => {
        document.getElementById('status').textContent = 'Не вдалося завантажити latest.json: ' + err.message;
      });
  </script>
</body>
</html>
